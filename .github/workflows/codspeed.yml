name: CodSpeed

# Measures the example suite on CodSpeed. The case worth watching is bench/fib:
# the same recursion twice, differing only in whether the accumulators are
# forced. Locally the strict variant allocates 0 B and the lazy one 47 KB at
# n=1000 and 628 KB at n=10000, so a regression that turns a strict fold lazy
# shows up as an enormous allocation jump long before it is visible in wall time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GHC_VERSION: "9.12.4"
  CABAL_VERSION: "3.14.2.0"

jobs:
  benchmarks:
    name: CodSpeed benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner exchange an OIDC token, so a public repository needs no
      # CODSPEED_TOKEN secret.
      #
      # Do not "helpfully" add `token: ${{secrets.CODSPEED_TOKEN}}` as a fallback.
      # An unset secret expands to the empty string, which the runner still binds
      # as a present-but-invalid token and then skips OIDC entirely -- producing a
      # 401 at upload that looks like a permissions problem and is not.
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{env.GHC_VERSION}}
        cabal-version: ${{env.CABAL_VERSION}}

    - name: Cache cabal store
      uses: actions/cache@v4
      with:
        path: |
          ${{steps.setup.outputs.cabal-store}}
          dist-newstyle
        key: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-${{hashFiles('cabal.project.freeze', 'haskell-codspeed.cabal')}}
        restore-keys: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-

    # Built before the measurement step so compilation is not inside the window.
    - name: Build the benchmark
      run: |
        cabal update
        cabal build bench:example

    - name: Locate the binaries
      id: bin
      run: |
        {
          echo "path=$(cabal list-bin bench:example)"
          echo "rewrite=$(cabal list-bin codspeed-hs-rewrite)"
        } >>"$GITHUB_OUTPUT"

    # Simulation rather than walltime: it is deterministic, and a GitHub-hosted
    # runner is too noisy for walltime to mean much. Note this makes the run
    # roughly 200x slower than native, which is fine for a suite this size.
    #
    # The rewrite step is chained onto the measured command rather than run
    # afterwards, and it has to be. Callgrind writes the profile when the
    # benchmark process exits, and the runner tars and uploads the folder when
    # the whole command returns -- so between those two moments is the only
    # window in which the file exists and is still ours. It runs under Valgrind
    # too, which is why it is ByteString and does one pass.
    - name: Run benchmarks
      uses: CodSpeedHQ/action@v5
      env:
        # Per-benchmark allocation, written by the suite itself. Uploaded below;
        # this is the metric CodSpeed has no channel for.
        CODSPEED_HS_SIDECAR: ${{github.workspace}}/allocation.csv
      with:
        mode: simulation
        run: ${{steps.bin.outputs.path}} && ${{steps.bin.outputs.rewrite}}

    # The sidecar is measured under the instrument, on the code path no local run
    # exercises, so it needs checking there. It shipped broken: the root frame
    # moved the body onto a fresh bound thread while the per-thread allocation
    # counter was still being read on the calling one, and every benchmark
    # reported the harness's 2.7-5.0 KB instead. Nothing failed -- the numbers
    # were plausible, constant, and wrong.
    #
    # So assert the property the fib pair exists to demonstrate: lazy allocates
    # heavily, strict allocates nothing. Both figures come from the same
    # mechanism, so this catches the whole class.
    - name: Check the sidecar measured the benchmark, not the harness
      if: always()
      run: |
        [ -f allocation.csv ] || {
          echo "::error::the suite wrote no sidecar at all"; exit 1; }
        cat allocation.csv
        leaky=$(awk -F, '$1=="example:All.fib.10000.leaky"{print $2}' allocation.csv)
        strict=$(awk -F, '$1=="example:All.fib.10000.strict"{print $2}' allocation.csv)
        echo "leaky=$leaky strict=$strict"
        [ -n "$leaky" ] && [ -n "$strict" ] || {
          echo "::error::fib.10000 rows missing from the sidecar"; exit 1; }
        # Natively: 643418 B and 0 B.
        [ "$leaky" -gt 100000 ] || {
          echo "::error::lazy fib allocated $leaky B; expected hundreds of kB. The allocation counter is being read on the wrong thread."; exit 1; }
        [ "$strict" -eq 0 ] || {
          echo "::error::strict fib allocated $strict B; expected 0. Something outside the body is being charged to it."; exit 1; }

    - name: Upload allocation sidecar
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allocation-csv
        path: allocation.csv
        if-no-files-found: warn

  # Why the suite has no flamegraph in CodSpeed's UI, which is the whole point of
  # the package.
  #
  # Ruled out already, by evidence rather than reasoning:
  #   size            codspeed-cpp renders a 90.8 ns benchmark; ours are ~1000x
  #                   bigger and do not
  #   exec-harness    that same codspeed-cpp benchmark is in-process
  #                   instrument-hooks, the same shape as ours
  #   root frame, markers, env json, URI shape, metadata ordering
  #                   all present and correct in profiles that still get nothing
  #   build metadata  194837f reported a plain "0.1.0" and still got nothing
  #   delay           still false 20+ minutes on, and on every older run
  #
  # What is left is the integration NAME. Under simulation the only identity a
  # profile carries is the "Metadata: <name> <version>" client request, and
  # codspeed.io/docs/instruments/cpu lists profiling availability per *named*
  # integration with minimum versions -- which can only be a server-side lookup
  # on that string. `haskell-codspeed` is not in that table.
  #
  # So: same binary, same everything, one token of the reported name changed.
  #   as_is       records, no flamegraph (control -- if this flips, stop and read)
  #   as_cpp      reports codspeed-cpp 1.5.0
  #   as_pytest   reports pytest-codspeed 3.0.0
  #
  # Spoofing is a diagnostic, not a fix. If a borrowed name renders, the answer is
  # to ask CodSpeed to add this integration, not to keep misreporting who produced
  # the run.
  #
  # Uses CodSpeedHQ/action rather than the CLI so each leg gets its own run part
  # (see the note on `upstream-example`), and gives each leg its own component so
  # the benchmark URIs cannot collide and overwrite one another.
  flamegraph-probe:
    name: Flamegraph probe (${{matrix.arm}})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: as_is
          integration: ""
          iversion: ""
        - arm: as_cpp
          integration: codspeed-cpp
          iversion: "1.5.0"
        - arm: as_pytest
          integration: pytest-codspeed
          iversion: "3.0.0"
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{env.GHC_VERSION}}
        cabal-version: ${{env.CABAL_VERSION}}
    - uses: actions/cache@v4
      with:
        path: |
          ${{steps.setup.outputs.cabal-store}}
          dist-newstyle
        key: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-${{hashFiles('cabal.project.freeze', 'haskell-codspeed.cabal')}}
        restore-keys: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-

    - name: Build
      run: cabal update && cabal build bench:example

    - name: Locate the binary
      id: bin
      run: echo "path=$(cabal list-bin bench:example)" >>"$GITHUB_OUTPUT"

    # Two benchmarks only: the question is whether a flamegraph exists at all,
    # and simulation is ~200x native.
    - name: Measure under a probed integration name
      uses: CodSpeedHQ/action@v5
      env:
        CODSPEED_HS_PROBE_INTEGRATION: ${{matrix.integration}}
        CODSPEED_HS_PROBE_VERSION: ${{matrix.iversion}}
        CODSPEED_HS_COMPONENT: probe-${{matrix.arm}}
      with:
        mode: simulation
        run: ${{steps.bin.outputs.path}} --pattern 'fib.1000'

  # Captures the raw callgrind output and checks its shape.
  #
  # None of these are known backend requirements -- the one requirement that bit
  # us was the integration version, which is asserted by a unit test instead.
  # They are the properties this package intends its profile to have: metadata
  # part first (what every integration does), a root frame per benchmark (what
  # shapes the flamegraph), non-zero totals (that instrumentation ran at all).
  #
  # The totals check also settles a retracted claim: set_integration used to run
  # last, on a local probe that appeared to show its CALLGRIND_DUMP_STATS_AT
  # leaving callgrind unable to instrument anything afterwards. It runs first
  # now, so zero totals would mean that probe was right after all.
  #
  # Runs the CLI directly because `codspeed run` accepts --profile-folder and the
  # action does not.
  profile-dump:
    name: Capture the raw profile
    runs-on: ubuntu-latest
    # See the note on `upstream-example`: this job uploads too, and a commit with
    # more than one upload cannot be read.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{env.GHC_VERSION}}
        cabal-version: ${{env.CABAL_VERSION}}
    - uses: actions/cache@v4
      with:
        path: |
          ${{steps.setup.outputs.cabal-store}}
          dist-newstyle
        key: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-${{hashFiles('cabal.project.freeze', 'haskell-codspeed.cabal')}}
        restore-keys: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-

    - name: Build
      run: cabal update && cabal build bench:example

    - name: Run with a known profile folder
      run: |
        curl -fsSL https://codspeed.io/install.sh | bash
        export PATH="$HOME/.codspeed/bin:$PATH"
        mkdir -p "$GITHUB_WORKSPACE/profile"
        codspeed run -m simulation --profile-folder "$GITHUB_WORKSPACE/profile" \
          -- "$(cabal list-bin bench:example)" --pattern 'fib.1000' || true

    - name: Check the profile against the four requirements
      if: always()
      run: |
        cd "$GITHUB_WORKSPACE/profile" 2>/dev/null || { echo "no profile folder"; exit 1; }
        {
          echo '## Files'; ls -la
          # The benchmark process writes the largest .out; the others are the
          # shell wrapper and, in walltime, the runner's own.
          f=$(ls -S ./*.out 2>/dev/null | head -1)
          [ -n "$f" ] || echo '  FAIL no .out file in the profile folder'
          echo "## $f"
          echo '### part order and cost'
          grep -E '^(part:|desc: Trigger: Client Request|totals:)' "$f" \
            | sed 's/^desc: Trigger: Client Request: /  trigger: /'

          echo '### requirements'
          first=$(grep -m1 '^desc: Trigger: Client Request' "$f")
          case "$first" in
            *"Client Request: Metadata:"*) echo '  ok   metadata is the first part' ;;
            *) echo "  FAIL metadata is not first (first trigger: $first)" ;;
          esac

          n=$(grep -c '^fn=__codspeed_root_frame__' "$f" || true)
          if [ "$n" -gt 0 ]; then echo "  ok   root frame present ($n)"
          else echo '  FAIL no __codspeed_root_frame__ frame'; fi

          # Not asserted on: add_marker writes nothing under simulation. Its
          # dispatch handles the walltime and analysis instruments and falls
          # through to success for anything else (cbits/core.c around 44264), and
          # no first-party integration emits markers on this path either. Shown
          # because the calls are still made, and will matter under walltime.
          echo "  note marker frames: $(grep -c '^c\?fn=instrument_hooks_add_marker' "$f" || true)"

          # Written on purpose, like every first-party integration does; listed
          # so the folder's contents stay visible rather than asserted on.
          if ls environment-*.json >/dev/null 2>&1; then
            echo "  ok   environment json present: $(cat environment-*.json | tr -d '\n ' | head -c 200)"
          else echo '  note no environment json'; fi

          # Zero totals on every benchmark part would mean the retracted
          # dump-poisons-instrumentation claim was right after all.
          if grep -E '^totals: [1-9]' "$f" >/dev/null; then
            echo '  ok   at least one part has non-zero totals'
          else echo '  FAIL every part totals zero'; fi

          for l in valgrind*.log runner.log; do
            [ -f "$l" ] && { echo "## $l"; tail -25 "$l"; }
          done
          true
        } >"$RUNNER_TEMP/profile-report.txt" 2>&1
        cat "$RUNNER_TEMP/profile-report.txt"
        cat "$RUNNER_TEMP/profile-report.txt" >>"$GITHUB_STEP_SUMMARY"
        # Written to a file rather than piped to tee, because a pipeline puts the
        # whole group in a subshell and any status it sets there is lost.
        if grep -q '  FAIL' "$RUNNER_TEMP/profile-report.txt"; then
          echo "::error::the profile violates a requirement the backend does not report violations of"
          exit 1
        fi

    - name: Upload the profile
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: raw-profile
        path: profile/
        if-no-files-found: warn

  # Differential test: mutate upstream's example/main.c by one token per leg and
  # see which URIs come back.
  #
  # READ THE GH_MATRIX NOTE BELOW BEFORE ADDING LEGS. Without those two env vars
  # every leg uploads under the same run part and the backend keeps only the last,
  # so the others are never read. That happened, and it produced a confident,
  # entirely false result: legs claiming that metadata ordering, the root frame,
  # markers and an environment json were each individually fatal. They were simply
  # overwritten. Anything inferred from a leg that ran without GH_MATRIX is void.
  #
  # What this job has actually established, from legs that were read:
  #
  #   verbatim, uri_bare, uri_path, integration_name   all recorded (022dbe9,
  #     which used CodSpeedHQ/action -- the action sets GH_MATRIX itself)
  #   multi   three benchmarks on one session in one process   recorded
  #
  # So: custom integrations work here, bare and `::`-path URIs both work, the
  # name `haskell-codspeed` works, and many benchmarks per process work.
  #
  # `control` stays as a standing positive control. The other mutations are kept
  # in the case block, unused, because re-deriving them cost four rounds -- but
  # note that markers and the environment json are now known NOT to be required:
  # no CodSpeed integration emits markers under simulation, and CodSpeed's own
  # exec-harness has no root frame at all.
  upstream-example:
    name: Probe (${{matrix.variant}})
    runs-on: ubuntu-latest
    # Manual only. Several jobs uploading for one commit is not readable: across
    # three runs the same control recorded, then did not, and the surviving set
    # was whichever job uploaded last -- except in one run where four merged.
    # Whatever the backend does with concurrent uploads, a probe cannot be run
    # alongside anything else, and neither can the suite whose result matters.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        variant: [control, multi, uri_colon]
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    # Two hand-written probes in a row failed at their own control, so stop
    # rewriting upstream's example and mutate it instead. The applied diff is
    # printed so the mutation can be checked rather than assumed.
    - name: Build from upstream's example, mutating one thing
      env:
        VARIANT: ${{matrix.variant}}
      run: |
        mkdir -p /tmp/ex && cd /tmp/ex
        curl -fsSL -o main.c \
          https://raw.githubusercontent.com/CodSpeedHQ/instrument-hooks/main/example/main.c
        cp main.c orig.c
        # Every variant is identifiable by its URI, and `control` isolates the
        # rename itself.
        sed -i "s|\"example_benchmark\"|\"probe_$VARIANT\"|" main.c
        SETINT='instrument_hooks_set_integration(hooks, "custom-integration", "1.0.0");'
        case "$VARIANT" in
          control) ;;
          uri_colon)
            sed -i 's|"probe_uri_colon"|"probe_uri_colon:All.fib.1000.leaky"|' main.c ;;
          multi)
            # Wraps the measured region -- start_benchmark through
            # set_executed_benchmark -- in a loop, so it is three benchmarks on
            # one session in one process, the way a real suite reports.
            sed -i 's|^  printf("Starting benchmark\.\.\.\\n");|  for (int b = 0; b < 3; b++) {\n  char uribuf[64];\n  snprintf(uribuf, sizeof uribuf, "probe_multi_%d", b);\n  printf("Starting benchmark...\\n");|' main.c
            sed -i 's|"probe_multi") != 0) {|uribuf) != 0) {|' main.c
            sed -i 's|^  printf("Benchmark completed successfully\\n");|  }\n  printf("Benchmark completed successfully\\n");|' main.c ;;
          meta_last)
            # Only the final deinit is at two-space indent; the error paths are
            # at four, so this anchors on the successful exit.
            sed -i "/$SETINT/d" main.c
            sed -i "s|^  instrument_hooks_deinit(hooks);|  $SETINT\n  instrument_hooks_deinit(hooks);|" main.c ;;
          no_root)
            sed -i 's|__codspeed_root_frame__example(example_function);|example_function();|' main.c ;;
          no_markers)
            sed -i '/instrument_hooks_add_marker(hooks, pid, MARKER_TYPE_BENCHMARK_START,/,+1d' main.c
            sed -i '/instrument_hooks_add_marker(hooks, pid, MARKER_TYPE_BENCHMARK_END,/,+1d' main.c ;;
          env_json)
            sed -i 's|^  instrument_hooks_deinit(hooks);|  instrument_hooks_set_environment(hooks, "haskell", "ghc-version", "9.12.4");\n  instrument_hooks_write_environment(hooks, pid);\n  instrument_hooks_deinit(hooks);|' main.c ;;
        esac
        echo "### mutation applied:"; diff orig.c main.c || true
        gcc -O1 -o example main.c \
          "$GITHUB_WORKSPACE/vendor/instrument-hooks/cbits/core.c" \
          -I"$GITHUB_WORKSPACE/vendor/instrument-hooks/includes" \
          -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-unused-parameter \
          -Wno-unused-but-set-variable -Wno-type-limits -Wno-format -Wno-format-security

    # Via the CLI rather than the action, so --profile-folder keeps the profile
    # each variant produced -- the upload result says whether the backend liked
    # it, and the folder says what it was actually given.
    - name: Measure it, keeping the profile
      env:
        VARIANT: ${{matrix.variant}}
        # Not optional in a matrix. The runner derives
        #   run_part_id = "{job}-{matrix}-{strategy}"  if both parse as JSON objects
        #   run_part_id = "{job}"                      otherwise
        # (runner 5.0.1, src/run_environment/github_actions/provider.rs:226-243),
        # and only CodSpeedHQ/action sets these two -- the bare CLI does not. So
        # every leg of this matrix was uploading under the identical run part, and
        # the backend kept whichever arrived last. Both are required: the `if let`
        # matches a tuple, so setting one alone changes nothing.
        GH_MATRIX: ${{toJson(matrix)}}
        GH_STRATEGY: ${{toJson(strategy)}}
      run: |
        curl -fsSL https://codspeed.io/install.sh | bash
        export PATH="$HOME/.codspeed/bin:$PATH"
        mkdir -p "$GITHUB_WORKSPACE/cprofile"
        codspeed run -m simulation --profile-folder "$GITHUB_WORKSPACE/cprofile" \
          -- /tmp/ex/example || true
        {
          echo "## $VARIANT"
          ls -la "$GITHUB_WORKSPACE/cprofile"
          for f in "$GITHUB_WORKSPACE"/cprofile/*.out; do
            [ -f "$f" ] || continue
            echo "### $(basename "$f")"
            grep -E '^(part:|desc: Trigger|totals:)' "$f" | head -20
          done
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload the profile
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: c-profile-${{matrix.variant}}
        path: cprofile/
        if-no-files-found: warn

  flamegraph:
    name: Cost-centre flamegraphs
    runs-on: ubuntu-latest
    # Independent of CodSpeed entirely: a profiling build reading GHC's own
    # cost-centre tree. This is what produces frames naming Haskell functions
    # rather than RTS internals, and it needs no token and no runner.
    steps:
    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{env.GHC_VERSION}}
        cabal-version: ${{env.CABAL_VERSION}}

    - name: Cache cabal store
      uses: actions/cache@v4
      with:
        path: |
          ${{steps.setup.outputs.cabal-store}}
          dist-newstyle
        key: prof-${{runner.os}}-ghc${{env.GHC_VERSION}}-${{hashFiles('cabal.project.freeze', 'haskell-codspeed.cabal')}}
        restore-keys: prof-${{runner.os}}-ghc${{env.GHC_VERSION}}-

    # late-toplevel inserts cost centres after optimisation, so the profile
    # describes the program that actually runs rather than the one written.
    - name: Build profiling-way
      run: |
        cabal update
        cabal build bench:example \
          --enable-profiling --enable-library-profiling \
          --profiling-detail=late-toplevel

    - name: Collect per-benchmark profiles
      env:
        CODSPEED_HS_CCS_DIR: ${{github.workspace}}/ccs
      run: |
        BIN=$(cabal list-bin bench:example \
          --enable-profiling --enable-library-profiling \
          --profiling-detail=late-toplevel)
        "$BIN"
        echo "## Cost centres, fib/10000/leaky" >>"$GITHUB_STEP_SUMMARY"
        echo '```' >>"$GITHUB_STEP_SUMMARY"
        head -8 ccs/*fib__10000__leaky.folded >>"$GITHUB_STEP_SUMMARY" || true
        echo '```' >>"$GITHUB_STEP_SUMMARY"

    - name: Upload folded stacks
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cost-centre-profiles
        path: ccs/
        if-no-files-found: warn
