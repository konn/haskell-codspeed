name: CodSpeed

# Measures the example suite on CodSpeed. The case worth watching is bench/fib:
# the same recursion twice, differing only in whether the accumulators are
# forced. Locally the strict variant allocates 0 B and the lazy one 47 KB at
# n=1000 and 628 KB at n=10000, so a regression that turns a strict fold lazy
# shows up as an enormous allocation jump long before it is visible in wall time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GHC_VERSION: "9.12.4"
  CABAL_VERSION: "3.14.2.0"

jobs:
  benchmarks:
    name: CodSpeed benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner exchange an OIDC token, so a public repository needs no
      # CODSPEED_TOKEN secret.
      #
      # Do not "helpfully" add `token: ${{secrets.CODSPEED_TOKEN}}` as a fallback.
      # An unset secret expands to the empty string, which the runner still binds
      # as a present-but-invalid token and then skips OIDC entirely -- producing a
      # 401 at upload that looks like a permissions problem and is not.
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{env.GHC_VERSION}}
        cabal-version: ${{env.CABAL_VERSION}}

    - name: Cache cabal store
      uses: actions/cache@v4
      with:
        path: |
          ${{steps.setup.outputs.cabal-store}}
          dist-newstyle
        key: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-${{hashFiles('cabal.project.freeze', 'haskell-codspeed.cabal')}}
        restore-keys: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-

    # Built before the measurement step so compilation is not inside the window.
    - name: Build the benchmark
      run: |
        cabal update
        cabal build bench:example

    - name: Locate the binary
      id: bin
      run: echo "path=$(cabal list-bin bench:example)" >>"$GITHUB_OUTPUT"

    # Simulation rather than walltime: it is deterministic, and a GitHub-hosted
    # runner is too noisy for walltime to mean much. Note this makes the run
    # roughly 200x slower than native, which is fine for a suite this size.
    - name: Run benchmarks
      uses: CodSpeedHQ/action@v5
      env:
        # CodSpeed's URI convention is {git-relative-path}::{name}. Without this
        # the prefix falls back to the executable name, giving example::fib::...
        # -- which reaches the callgrind file intact but is not a path, and the
        # backend recorded no benchmarks for it.
        CODSPEED_HS_SOURCE_FILE: bench/Example.hs
        # Per-benchmark allocation, written by the suite itself. Uploaded below;
        # this is the metric CodSpeed has no channel for.
        CODSPEED_HS_SIDECAR: ${{github.workspace}}/allocation.csv
      with:
        mode: simulation
        run: ${{steps.bin.outputs.path}}

    - name: Upload allocation sidecar
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allocation-csv
        path: allocation.csv
        if-no-files-found: warn

  # Diagnostic. Reproducing CI locally -- CodSpeed's own Valgrind fork, the exact
  # argument list from src/executor/valgrind/measure.rs -- yields a complete and
  # correct profile: every benchmark URI, metadata last, all fourteen event
  # columns, non-zero totals. CodSpeed nonetheless reports no benchmark results.
  #
  # The untested differences are x86_64 versus the arm64 used locally, and the
  # wrapping `codspeed run` puts around valgrind. So capture what CI actually
  # produces and diff it against the known-good profile.
  #
  # Runs the CLI directly only because `codspeed run` accepts --profile-folder and
  # the action does not. Delete once this is settled.
  profile-dump:
    name: Capture the raw profile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{env.GHC_VERSION}}
        cabal-version: ${{env.CABAL_VERSION}}
    - uses: actions/cache@v4
      with:
        path: |
          ${{steps.setup.outputs.cabal-store}}
          dist-newstyle
        key: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-${{hashFiles('cabal.project.freeze', 'haskell-codspeed.cabal')}}
        restore-keys: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-

    - name: Build
      run: cabal update && cabal build bench:example

    - name: Run with a known profile folder
      env:
        CODSPEED_HS_SOURCE_FILE: bench/Example.hs
      run: |
        curl -fsSL https://codspeed.io/install.sh | bash
        export PATH="$HOME/.codspeed/bin:$PATH"
        mkdir -p "$GITHUB_WORKSPACE/profile"
        codspeed run -m simulation --profile-folder "$GITHUB_WORKSPACE/profile" \
          -- "$(cabal list-bin bench:example)" --pattern 'fib.1000' || true

    - name: Compare against the known-good local profile
      if: always()
      run: |
        cd "$GITHUB_WORKSPACE/profile" 2>/dev/null || { echo "no profile folder"; exit 0; }
        {
          echo '## Files'; ls -la
          for f in *.out*; do
            [ -f "$f" ] || continue
            echo "## $f"
            echo '### benchmark URIs (expect 2 + Metadata last)'
            grep -E '^desc: Trigger: Client Request' "$f" | sed 's/.*Client Request: /  /' || echo '  NONE'
            echo '### events / totals (expect 14 columns, non-zero)'
            grep -m1 '^events:' "$f" || echo '  no events line'
            grep -m1 '^totals:' "$f" || echo '  no totals line'
            echo "### parts: $(grep -c '^part:' "$f" || echo 0)"
          done
          for l in valgrind*.log runner.log; do
            [ -f "$l" ] && { echo "## $l"; tail -25 "$l"; }
          done
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload the profile
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: raw-profile
        path: profile/
        if-no-files-found: warn

  # Differential test, and the only one left that does not require guessing at a
  # closed backend.
  #
  # CI's Haskell profile is demonstrably correct -- six parts, every benchmark
  # URI, metadata last, non-zero totals across all fourteen event columns, valgrind
  # and program both exiting 0 -- and CodSpeed still reports no benchmark results.
  # So run upstream's own example/main.c, which is C, is not this project, and uses
  # the documented API verbatim, through the identical pipeline.
  #
  #   it also records nothing  -> the constraint is on custom integrations or on
  #                               this repository, not on anything written here
  #   it records results       -> our profile differs from a working one in some
  #                               way, and the two can be diffed directly
  upstream-example:
    name: Upstream C example (differential)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    # Upstream's example recorded fine (`example_benchmark`, 211.8 ms) while the
    # Haskell suite records nothing, so custom integrations work here and the
    # difference is ours. The most visible one is the URI: a bare name versus
    # bench/Example.hs::fib::1000::leaky.
    #
    # One C program, several URI shapes, one round-trip. Whichever shapes come
    # back name the constraint.
    - name: Build a URI-shape probe
      run: |
        mkdir -p /tmp/ex && cd /tmp/ex
        cat > probe.c <<'EOF'
        #include <stdio.h>
        #include "core.h"
        static volatile long sink;
        static void work(int n){ for (long i=0;i<n*100000L;i++) sink += i; }
        static const char *uris[] = {
          "bare_name",
          "prefix::name",
          "bench/Example.hs::one",
          "bench/Example.hs::fib::1000::leaky",
          "noext/path::two",
        };
        int main(void){
          InstrumentHooks *h = instrument_hooks_init();
          for (unsigned k = 0; k < sizeof uris / sizeof *uris; k++) {
            instrument_hooks_start_benchmark_inline(h);
            work(k + 1);
            instrument_hooks_stop_benchmark_inline(h);
            instrument_hooks_set_executed_benchmark(h, 1234, uris[k]);
          }
          /* last, per the ordering fix */
          instrument_hooks_set_integration(h, "haskell-codspeed", "0.1.0.0");
          instrument_hooks_deinit(h);
          return 0;
        }
        EOF
        gcc -O1 -o example probe.c \
          "$GITHUB_WORKSPACE/vendor/instrument-hooks/cbits/core.c" \
          -I"$GITHUB_WORKSPACE/vendor/instrument-hooks/includes" \
          -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-unused-parameter \
          -Wno-unused-but-set-variable -Wno-type-limits -Wno-format -Wno-format-security

    - name: Measure it
      uses: CodSpeedHQ/action@v5
      with:
        mode: simulation
        run: /tmp/ex/example

  flamegraph:
    name: Cost-centre flamegraphs
    runs-on: ubuntu-latest
    # Independent of CodSpeed entirely: a profiling build reading GHC's own
    # cost-centre tree. This is what produces frames naming Haskell functions
    # rather than RTS internals, and it needs no token and no runner.
    steps:
    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{env.GHC_VERSION}}
        cabal-version: ${{env.CABAL_VERSION}}

    - name: Cache cabal store
      uses: actions/cache@v4
      with:
        path: |
          ${{steps.setup.outputs.cabal-store}}
          dist-newstyle
        key: prof-${{runner.os}}-ghc${{env.GHC_VERSION}}-${{hashFiles('cabal.project.freeze', 'haskell-codspeed.cabal')}}
        restore-keys: prof-${{runner.os}}-ghc${{env.GHC_VERSION}}-

    # late-toplevel inserts cost centres after optimisation, so the profile
    # describes the program that actually runs rather than the one written.
    - name: Build profiling-way
      run: |
        cabal update
        cabal build bench:example \
          --enable-profiling --enable-library-profiling \
          --profiling-detail=late-toplevel

    - name: Collect per-benchmark profiles
      env:
        CODSPEED_HS_CCS_DIR: ${{github.workspace}}/ccs
      run: |
        BIN=$(cabal list-bin bench:example \
          --enable-profiling --enable-library-profiling \
          --profiling-detail=late-toplevel)
        "$BIN"
        echo "## Cost centres, fib/10000/leaky" >>"$GITHUB_STEP_SUMMARY"
        echo '```' >>"$GITHUB_STEP_SUMMARY"
        head -8 ccs/*fib__10000__leaky.folded >>"$GITHUB_STEP_SUMMARY" || true
        echo '```' >>"$GITHUB_STEP_SUMMARY"

    - name: Upload folded stacks
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cost-centre-profiles
        path: ccs/
        if-no-files-found: warn
