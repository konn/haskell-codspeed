name: CodSpeed

# Measures the example suite on CodSpeed. The case worth watching is bench/fib:
# the same recursion twice, differing only in whether the accumulators are
# forced. Locally the strict variant allocates 0 B and the lazy one 47 KB at
# n=1000 and 628 KB at n=10000, so a regression that turns a strict fold lazy
# shows up as an enormous allocation jump long before it is visible in wall time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GHC_VERSION: "9.12.4"
  CABAL_VERSION: "3.14.2.0"

jobs:
  benchmarks:
    name: CodSpeed benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner exchange an OIDC token, so a public repository needs no
      # CODSPEED_TOKEN secret.
      #
      # Do not "helpfully" add `token: ${{secrets.CODSPEED_TOKEN}}` as a fallback.
      # An unset secret expands to the empty string, which the runner still binds
      # as a present-but-invalid token and then skips OIDC entirely -- producing a
      # 401 at upload that looks like a permissions problem and is not.
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{env.GHC_VERSION}}
        cabal-version: ${{env.CABAL_VERSION}}

    - name: Cache cabal store
      uses: actions/cache@v4
      with:
        path: |
          ${{steps.setup.outputs.cabal-store}}
          dist-newstyle
        key: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-${{hashFiles('cabal.project.freeze', 'haskell-codspeed.cabal')}}
        restore-keys: codspeed-${{runner.os}}-ghc${{env.GHC_VERSION}}-

    # Built before the measurement step so compilation is not inside the window.
    - name: Build the benchmark
      run: |
        cabal update
        cabal build bench:example

    - name: Locate the binary
      id: bin
      run: echo "path=$(cabal list-bin bench:example)" >>"$GITHUB_OUTPUT"

    # Simulation rather than walltime: it is deterministic, and a GitHub-hosted
    # runner is too noisy for walltime to mean much. Note this makes the run
    # roughly 200x slower than native, which is fine for a suite this size.
    - name: Run benchmarks
      uses: CodSpeedHQ/action@v5
      env:
        # Per-benchmark allocation, written by the suite itself. Uploaded below;
        # this is the metric CodSpeed has no channel for.
        CODSPEED_HS_SIDECAR: ${{github.workspace}}/allocation.csv
      with:
        mode: simulation
        run: ${{steps.bin.outputs.path}}

    - name: Upload allocation sidecar
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allocation-csv
        path: allocation.csv
        if-no-files-found: warn

  flamegraph:
    name: Cost-centre flamegraphs
    runs-on: ubuntu-latest
    # Independent of CodSpeed entirely: a profiling build reading GHC's own
    # cost-centre tree. This is what produces frames naming Haskell functions
    # rather than RTS internals, and it needs no token and no runner.
    steps:
    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{env.GHC_VERSION}}
        cabal-version: ${{env.CABAL_VERSION}}

    - name: Cache cabal store
      uses: actions/cache@v4
      with:
        path: |
          ${{steps.setup.outputs.cabal-store}}
          dist-newstyle
        key: prof-${{runner.os}}-ghc${{env.GHC_VERSION}}-${{hashFiles('cabal.project.freeze', 'haskell-codspeed.cabal')}}
        restore-keys: prof-${{runner.os}}-ghc${{env.GHC_VERSION}}-

    # late-toplevel inserts cost centres after optimisation, so the profile
    # describes the program that actually runs rather than the one written.
    - name: Build profiling-way
      run: |
        cabal update
        cabal build bench:example \
          --enable-profiling --enable-library-profiling \
          --profiling-detail=late-toplevel

    - name: Collect per-benchmark profiles
      env:
        CODSPEED_HS_CCS_DIR: ${{github.workspace}}/ccs
      run: |
        BIN=$(cabal list-bin bench:example \
          --enable-profiling --enable-library-profiling \
          --profiling-detail=late-toplevel)
        "$BIN"
        echo "## Cost centres, fib/10000/leaky" >>"$GITHUB_STEP_SUMMARY"
        echo '```' >>"$GITHUB_STEP_SUMMARY"
        head -8 ccs/*fib__10000__leaky.folded >>"$GITHUB_STEP_SUMMARY" || true
        echo '```' >>"$GITHUB_STEP_SUMMARY"

    - name: Upload folded stacks
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cost-centre-profiles
        path: ccs/
        if-no-files-found: warn
